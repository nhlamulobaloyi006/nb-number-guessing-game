<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main">
        <div class="card">
            <div class="inputs">
                <input type="text" id="userValue" placeholder="Enter a number">
                <button id="submitBtn">✔</button>
            </div>
            <div class="range">
                <p id="range"></p>
            </div>
            <div class="display">
                <h2 id="randomNum">0</h2>
            </div>
            <div class="status">
                <p id="attempts">Attempts: 0</p>
                <p id="chosenNum">Chosen no: 0</p>
                <p id="wins">Wins: 0</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
